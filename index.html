<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AlacantinApp · Libro Genealógico de la Gallina Alacantina</title>
  <meta name="description" content="Libro Genealógico de la Gallina Alacantina (ESGA025): censo, altas, puesta y calificación conforme al Estándar oficial.">
  <meta name="theme-color" content="#22377f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <!-- Tema elegido por el usuario, antes de pintar (sin parpadeo) -->
  <script>try { var t = localStorage.getItem('alacantinapp-tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}</script>
  <link rel="stylesheet" href="./css/app.css">
  <!-- Cliente Supabase (opcional: sin él la app funciona en modo dispositivo). Versión fijada; el SW lo cachea. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <header class="cabecera">
    <a href="#/" class="marca" aria-label="Inicio">
      <img src="./icons/icon-192.png" alt="" width="36" height="36">
      <span><strong>AlacantinApp</strong><small>Libro Genealógico · ESGA025</small></span>
    </a>
    <div class="cabecera-estado">
      <button id="boton-buscar" class="btn btn-pequeno boton-icono" type="button" aria-label="Buscar por anilla" title="Buscar por anilla (tecla /)"><svg class="icono" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></svg></button>
      <span id="estado-red" class="chip" title="Estado de la conexión">—</span>
      <button id="estado-cola" class="chip chip-boton oculto" type="button" title="Operaciones pendientes de sincronizar"></button>
      <button id="boton-cuenta" class="btn btn-pequeno" type="button">Entrar</button>
    </div>
  </header>

  <main id="principal" tabindex="-1">
    <noscript><p class="tarjeta">AlacantinApp necesita JavaScript activado.</p></noscript>
    <p class="cargando">Cargando…</p>
  </main>

  <!-- Barra inferior: la genera js/app.js según el rol (3 columnas visitante · 4 columnas usuarios) -->
  <nav id="barra" class="barra" aria-label="Navegación principal"></nav>

  <!-- Zona exclusiva de impresión (certificados y actas) -->
  <section id="impresion" aria-hidden="true"></section>

  <div id="aviso" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
